<body>

    <h2>Check file(code)</h2>

    <input type="file" id="fileInput" accept=".txt,.js,.py,.html,.css,.json">

    <br>
    <button onclick="processFile()">Check file(code)</button>

    <div id="result">Result...</div>

    <script>
        function processFile() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');

            // Проверяем, выбран ли файл
            if (!fileInput.files.length) {
                resultDiv.textContent = "Error:no file!";
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            // Когда файл прочитан
            reader.onload = function(e) {
                const content = e.target.result;

                // ===== ДЕЙСТВИЕ С ФАЙЛОМ =====
                const lines = content.split('\n');
                const totalLines = lines.length;
                const nonEmptyLines = lines.filter(line => line.trim() !== '').length;
                const characters = content.length;
                const words = content.trim() ? content.trim().split(/\s+/).length : 0;

                // Формируем результат
                let report = `File: ${file.name}\n`;
                report += `Size: ${(file.size / 1024).toFixed(2)} КБ\n\n`;
                report += `=== Result ===\n`;
                report += `Total Lines: ${totalLines}\n`;
                report += `Non Empty Lines: ${nonEmptyLines}\n`;
                report += `Words: ${words}\n`;
                report += `Characters: ${characters}\n\n`;
                report += `--- First 10 lines file ---\n`;
                report += lines.slice(0, 10).join('\n');

                // Выводим результат на экран
                resultDiv.textContent = report;
            };

            // Читаем файл как текст
            reader.readAsText(file);
        }
    </script>

</body>
