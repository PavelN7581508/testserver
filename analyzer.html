<body>

    <h2>Check code</h2>

    <textarea id="codeInput" placeholder="Code here..."></textarea>

    <br>
    <button onclick="analyzeCode()">Check code</button>

    <div id="result">Result...</div>

    <script>
        function analyzeCode() {
            const code = document.getElementById('codeInput').value;
            const resultDiv = document.getElementById('result');

            if (!code.trim()) {
                resultDiv.textContent = "Error: wrong code.";
                return;
            }

            // Базовый анализ
            const lines = code.split('\n');
            const totalLines = lines.length;
            const nonEmptyLines = lines.filter(line => line.trim() !== '').length;
            const characters = code.length;
            const charactersNoSpaces = code.replace(/\s/g, '').length;

            // Примерный подсчёт функций (для JS/Python/C-подобных языков)
            const functionMatches = code.match(/function\s+\w+|def\s+\w+|\w+\s*=\s*\(.*\)\s*=>/g) || [];
            const functionsCount = functionMatches.length;

            // Комментарии
            const singleLineComments = (code.match(/\/\/.*|#.*/g) || []).length;
            const multiLineComments = (code.match(/\/\*[\s\S]*?\*\//g) || []).length;

            // Результат
            let report = `=== Result ===\n\n`;
            report += `Total Lines: ${totalLines}\n`;
            report += `Non Empty Lines: ${nonEmptyLines}\n`;
            report += `Characters: ${characters}\n`;
            report += `Characters No Spaces: ${charactersNoSpaces}\n`;
            report += `Functions Count: ${functionsCount}\n`;
            report += `SingleLine Comments: ${singleLineComments}\n`;
            report += `MultiLine Comments: ${multiLineComments}\n`;

            resultDiv.textContent = report;
        }
    </script>
