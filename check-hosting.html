<body>
 <h1>Check hosting website</h1>

    <div class="input-group">
        <input type="text" id="siteInput" placeholder="Ex: google.com" value="">
        <button id="checkBtn" onclick="checkHosting()">Check</button>
    </div>

    <div id="result"></div>

    <script>
        // Очистка домена
        function cleanDomain(url) {
            url = url.trim().toLowerCase();
            url = url.replace(/^(https?:\/\/)?(www\.)?/, '');
            url = url.split('/')[0];
            return url;
        }

        // Получение A-записи (IP) через Google DNS
        async function getIP(domain) {
            const res = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
            const data = await res.json();
            if (data.Answer && data.Answer.length > 0) {
                // Берём первую A-запись
                const aRecord = data.Answer.find(r => r.type === 1);
                return aRecord ? aRecord.data : null;
            }
            return null;
        }

        // Получение Nameservers
        async function getNameservers(domain) {
            try {
                const res = await fetch(`https://dns.google/resolve?name=${domain}&type=NS`);
                const data = await res.json();
                if (data.Answer) {
                    return data.Answer
                        .filter(r => r.type === 2)
                        .map(r => r.data.replace(/\.$/, ''));
                }
            } catch (e) {}
            return [];
        }

        // Информация о IP (хостинг, страна и т.д.)
        async function getIpInfo(ip) {
            // Используем ipapi.co — хорошо работает с CORS
            const res = await fetch(`https://ipapi.co/${ip}/json/`);
            return await res.json();
        }

        async function checkHosting() {
            const input = document.getElementById('siteInput');
            const btn = document.getElementById('checkBtn');
            const resultDiv = document.getElementById('result');

            const domain = cleanDomain(input.value);
            if (!domain) {
                alert('Write name website');
                return;
            }

            btn.disabled = true;
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="loading">⏳ Checikng...</div>';

            try {
                // 1. Получаем IP
                const ip = await getIP(domain);
                if (!ip) {
                    throw new Error('Error IP-address. Write name website correctly.');
                }

                // 2. Nameservers и информация об IP параллельно
                const [nameservers, info] = await Promise.all([
                    getNameservers(domain),
                    getIpInfo(ip)
                ]);

                if (info.error) {
                    throw new Error(info.reason || 'Error info about hosting');
                }

                // Выводим результат
                resultDiv.innerHTML = `
                    <div class="row">
                        <div class="label">Domain:</div>
                        <div class="value">${domain}</div>
                    </div>
                    <div class="row">
                        <div class="label">IP-address:</div>
                        <div class="value">${ip}</div>
                    </div>
                    <div class="row">
                        <div class="label">Nameservers:</div>
                        <div class="value">${nameservers.length ? nameservers.join('<br>') : '—'}</div>
                    </div>
                    <div class="row">
                        <div class="label">Provider / ISP:</div>
                        <div class="value">${info.org || info.asn || '—'}</div>
                    </div>
                    <div class="row">
                        <div class="label">ASN:</div>
                        <div class="value">${info.asn || '—'}</div>
                    </div>
                    <div class="row">
                        <div class="label">Country:</div>
                        <div class="value">${info.country_name || '—'} ${info.country_code ? '(' + info.country_code + ')' : ''}</div>
                    </div>
                    <div class="row">
                        <div class="label">City:</div>
                        <div class="value">${info.city || '—'}</div>
                    </div>
                    <div class="row">
                        <div class="label">Region:</div>
                        <div class="value">${info.region || '—'}</div>
                    </div>
                `;
            } catch (err) {
                resultDiv.innerHTML = `<div class="error">❌ ${err.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        // Запуск по Enter
        document.getElementById('siteInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkHosting();
        });
    </script>
