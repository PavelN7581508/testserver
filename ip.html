        <style>

        .card {
            background: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        #ip {
            font-size: 28px;
            font-weight: bold;
            color: #1a73e8;
            margin-top: 15px;
        }
        .loading {
            color: #666;
        }
    </style>
<body>
    <div class="card">
        <h2>IP-адрес:</h2>
        <div id="ip" class="loading">Checking...</div>
    </div>

    <script>
        // Используем бесплатный сервис ipify
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip').textContent = data.ip;
                document.getElementById('ip').classList.remove('loading');
            })
            .catch(error => {
                document.getElementById('ip').textContent = 'Can"t checking IP';
                console.error(error);
            });
    </script>
</body>
