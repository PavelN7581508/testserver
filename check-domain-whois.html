<body>

   <h2>Check domain + WHOIS</h2>

  <div class="input-group">
    <input type="text" id="domain" placeholder="Ex: google.com" value="">
    <button id="checkBtn" onclick="checkDomain()">Check</button>
  </div>

  <div id="result"></div>

  <script>
    function isValidDomain(domain) {
      const regex = /^(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.[A-Za-z0-9-]{1,63})*\.[A-Za-z]{2,}$/;
      return regex.test(domain);
    }

    function formatDate(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('ru-RU', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return iso;
      }
    }

    async function checkDomain() {
      const input = document.getElementById('domain').value.trim().toLowerCase();
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('checkBtn');

      if (!input) {
        showResult('error', 'Write domain');
        return;
      }

      // Очищаем от протокола и пути
      let domain = input
        .replace(/^https?:\/\//, '')
        .replace(/\/.*$/, '')
        .replace(/^www\./, '');

      if (!isValidDomain(domain)) {
        showResult('error', `Domain not correct: <b>${domain}</b>`);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Checking...';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch(`https://who-dat.as93.net/${domain}`);

        if (!response.ok) {
          throw new Error(`Error API: ${response.status}`);
        }

        const data = await response.json();

        if (!data.isRegistered) {
          showResult('warning', `
            <h3>Domain <b>${domain}</b> Not registered</h3>
            <p>Register.</p>
          `);
          return;
        }

        // Формируем красивый вывод
        let html = `
          <h3 style="margin-top:0">WHOIS: <b>${data.domain}</b></h3>

          <div class="info-row">
            <div class="label">Registrar</div>
            <div class="value">${data.registrar?.name || '—'}</div>
          </div>

          <div class="info-row">
            <div class="label">Created</div>
            <div class="value">${formatDate(data.dates?.created)}</div>
          </div>

          <div class="info-row">
            <div class="label">Updated</div>
            <div class="value">${formatDate(data.dates?.updated)}</div>
          </div>

          <div class="info-row">
            <div class="label">Expires</div>
            <div class="value"><b>${formatDate(data.dates?.expires)}</b></div>
          </div>

          <div class="info-row">
            <div class="label">Status</div>
            <div class="value">
              ${(data.status || []).map(s => `<span class="status-badge">${s}</span>`).join('') || '—'}
            </div>
          </div>

          <div class="info-row">
            <div class="label">Name-servers</div>
            <div class="value">
              ${(data.nameservers || []).map(ns => ns.name).join('<br>') || '—'}
            </div>
          </div>
        `;

        // Дополнительная информация о регистраторе
        if (data.registrar?.url || data.registrar?.abuseEmail) {
          html += `
            <div class="info-row">
              <div class="label">Registrar contact</div>
              <div class="value">
                ${data.registrar.url ? `<a href="${data.registrar.url}" target="_blank">${data.registrar.url}</a><br>` : ''}
                ${data.registrar.abuseEmail || ''}
              </div>
            </div>
          `;
        }

        // Сырой JSON (можно скрыть)
        html += `
          <details style="margin-top:20px">
            <summary style="cursor:pointer">Show full info JSON</summary>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          </details>
        `;

        showResult('success', html);

      } catch (err) {
        showResult('error', `Error WHOIS:<br>${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Checking';
      }
    }

    function showResult(type, content) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = type;
      resultDiv.innerHTML = content;
      resultDiv.style.display = 'block';
    }

    // Проверка по Enter
    document.getElementById('domain').addEventListener('keypress', e => {
      if (e.key === 'Enter') checkDomain();
    });
  </script>

</body>
